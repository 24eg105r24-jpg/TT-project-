<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login | Anurag University Smart Announcements</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="display: flex; flex-direction: column; justify-content: space-between;">
<div th:replace="~{fragments/header :: header}"></div>

<main class="page-wrapper" style="max-width: 480px; margin: 2.5rem auto;">
    <div class="card" style="box-shadow: var(--shadow-xl); border-top: 4px solid var(--primary);">
        <div class="card-header" style="text-align: center; flex-direction: column; gap: 0.25rem; padding-top: 2rem;">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔐</div>
            <h2 style="font-size: 1.5rem;">College Portal Login</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem;">Enter your university credentials to continue</p>
        </div>

        <div class="card-body" style="padding: 1.75rem 2rem;">
            <!-- Error Alert -->
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
                Invalid credentials.
            </div>

            <!-- Success Alert -->
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">
                Logged out successfully.
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="email" class="form-label">College Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="rollno@anurag.edu.in" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
                    Sign In to Portal
                </button>
            </form>

            <!-- 1-Click Demo Credentials Buttons -->
            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px dashed var(--border-color);">
                <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.75rem; text-align: center;">
                    ⚡ 1-Click Demo Login
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <button type="button" class="btn btn-sm btn-secondary" onclick="fillCredentials('24eg105r24@anurag.edu.in', 'student123')" style="justify-content: flex-start;">
                        🎓 Student: <strong>24eg105r24@anurag.edu.in</strong>
                    </button>
                    <button type="button" class="btn btn-sm btn-secondary" onclick="fillCredentials('wisshwa.faculty@anurag.edu.in', 'faculty123')" style="justify-content: flex-start;">
                        👨‍🏫 Faculty: <strong>wisshwa.faculty@anurag.edu.in</strong>
                    </button>
                    <button type="button" class="btn btn-sm btn-secondary" onclick="fillCredentials('admin@anurag.edu.in', 'admin123')" style="justify-content: flex-start;">
                        🛡️ Admin: <strong>admin@anurag.edu.in</strong>
                    </button>
                </div>
            </div>
        </div>

        <div class="card-footer" style="text-align: center; font-size: 0.88rem;">
            New student without an account? <a th:href="@{/register}" style="font-weight: 700;">Register Here</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
