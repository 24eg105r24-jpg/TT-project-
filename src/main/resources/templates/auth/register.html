<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Anurag University Smart Announcements</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="page-wrapper" style="max-width: 620px; margin: 2rem auto;">
    <div class="card" style="box-shadow: var(--shadow-xl); border-top: 4px solid var(--accent);">
        <div class="card-header" style="flex-direction: column; text-align: center; gap: 0.25rem;">
            <div style="font-size: 2.2rem;">📝</div>
            <h2 style="font-size: 1.45rem;">Student Portal Registration</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem;">Create your university profile to receive targeted circulars</p>
        </div>

        <div class="card-body" style="padding: 2rem;">
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">Error</div>

            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="form-group">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="e.g. Narayanadas Wisshwakh Shen" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="email" class="form-label">College Email</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="24eg105r24@anurag.edu.in" required>
                    </div>

                    <div class="form-group">
                        <label for="rollNumber" class="form-label">Roll Number</label>
                        <input type="text" id="rollNumber" th:field="*{rollNumber}" class="form-control" placeholder="e.g. 24EG105R24" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div class="form-group">
                        <label for="phone" class="form-label">Contact Phone</label>
                        <input type="text" id="phone" th:field="*{phone}" class="form-control" placeholder="+91 63019 83933">
                    </div>
                </div>

                <div class="form-group">
                    <label for="departmentId" class="form-label">Department / Branch</label>
                    <select id="departmentId" name="departmentId" class="form-select" required>
                        <option value="">-- Select Your Department --</option>
                        <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.code + ' - ' + d.name}">CSE</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="academicYear" class="form-label">Academic Year</label>
                        <select id="academicYear" th:field="*{academicYear}" class="form-select" required>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="section" class="form-label">Class Section</label>
                        <select id="section" th:field="*{section}" class="form-select" required>
                            <option value="A">Section A</option>
                            <option value="B">Section B</option>
                            <option value="C">Section C</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-accent btn-lg" style="width: 100%; margin-top: 1rem;">
                    Complete Registration
                </button>
            </form>
        </div>

        <div class="card-footer" style="text-align: center; font-size: 0.88rem;">
            Already have an account? <a th:href="@{/login}" style="font-weight: 700;">Sign in here</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
