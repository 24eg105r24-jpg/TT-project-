<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Official Public Circular | Anurag University</title>
    <meta name="description" th:content="${metaDescription}">
    <meta property="og:title" th:content="${pageTitle}">
    <meta property="og:description" th:content="${metaDescription}">
    <meta property="og:type" content="article">
    <meta property="og:url" th:content="'https://announcements.anurag.edu.in/public/announcements/' + ${announcement.id}">
    <link rel="canonical" th:href="'https://announcements.anurag.edu.in/public/announcements/' + ${announcement.id}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="page-wrapper" style="max-width: 900px;">
    <div style="margin-bottom: 1.5rem;">
        <a th:href="@{/public/announcements}" class="btn btn-secondary btn-sm">&larr; Back to Public Bulletins</a>
    </div>

    <article class="card" style="box-shadow: var(--shadow-lg);">
        <header class="card-header" style="flex-direction: column; align-items: flex-start; gap: 0.75rem; padding: 2rem; background: linear-gradient(135deg, rgba(30, 58, 138, 0.05), transparent);">
            <div style="display: flex; gap: 0.5rem; align-items: center;">
                <span class="badge" th:classappend="${announcement.category.cssClass}" th:text="${announcement.category.icon + ' ' + announcement.category.label}">Academic</span>
                <span class="badge" style="background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0;">🌐 Verified Public Notice</span>
            </div>

            <h1 style="font-size: 2rem; line-height: 1.3;" th:text="${announcement.title}">
                Notice Title
            </h1>

            <div style="display: flex; justify-content: space-between; width: 100%; flex-wrap: wrap; gap: 1rem; border-top: 1px solid var(--border-color); padding-top: 0.75rem; font-size: 0.85rem; color: var(--text-secondary);">
                <span>Issued by <strong><span th:text="${announcement.author.fullName}">Author</span></strong> (Anurag University)</span>
                <span>📅 Published: <time th:text="${#temporals.format(announcement.publishedAt, 'dd MMMM yyyy')}">Date</time></span>
            </div>
        </header>

        <section class="card-body" style="padding: 2.25rem; font-size: 1.05rem; line-height: 1.8; color: var(--text-primary); white-space: pre-line;">
            <p th:text="${announcement.content}">Body content...</p>
        </section>

        <!-- Attachments -->
        <div th:if="${announcement.attachments != null && !announcement.attachments.isEmpty()}" style="padding: 1.5rem 2rem; border-top: 1px solid var(--border-color); background: var(--bg-surface);">
            <h3 style="font-size: 0.95rem; margin-bottom: 0.75rem;">Official Attachments</h3>
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <div th:each="att : ${announcement.attachments}" style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md);">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <span>📄</span>
                        <strong th:text="${att.originalFileName}">File.pdf</strong>
                        <span style="font-size: 0.75rem; color: var(--text-muted);" th:text="${'(' + att.getFormattedSize() + ')'}">(1 MB)</span>
                    </div>
                    <a th:href="@{'/attachments/' + ${att.id}}" class="btn btn-sm btn-primary">Download</a>
                </div>
            </div>
        </div>

        <footer class="card-footer" style="display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 2rem;">
            <span style="font-size: 0.82rem; color: var(--text-muted);">
                Official Communication • Registrar &amp; Examination Branch, Anurag University
            </span>
            <a th:href="@{/login}" class="btn btn-sm btn-outline">Student / Faculty Login</a>
        </footer>
    </article>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
