<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Departments | Anurag University</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="page-wrapper">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem;">
        <div>
            <h1>🏛️ Academic Departments &amp; Schools</h1>
            <p style="color: var(--text-secondary);">University departments used for audience targeting and student enrollment</p>
        </div>
    </div>

    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">Success</div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">Error</div>

    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; align-items: flex-start;">
        <!-- Department Table -->
        <div class="card">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Department Name</th>
                            <th>Description</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="d : ${departments}">
                            <td>
                                <strong style="font-family: 'JetBrains Mono', monospace; color: var(--primary-light);" th:text="${d.code}">CSE</strong>
                            </td>
                            <td th:text="${d.name}">Computer Science &amp; Engineering</td>
                            <td style="color: var(--text-secondary); font-size: 0.85rem;" th:text="${d.description}">Description</td>
                            <td>
                                <span class="badge" style="background: #ecfdf5; color: #047857;">Active</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Add Department Form -->
        <div class="card">
            <div class="card-header">
                <h3>Add New Department</h3>
            </div>
            <form th:action="@{/admin/departments}" th:object="${newDepartment}" method="post">
                <div class="card-body">
                    <div class="form-group">
                        <label for="code" class="form-label">Department Code *</label>
                        <input type="text" id="code" th:field="*{code}" class="form-control" placeholder="e.g. AIDS, CHE" required>
                    </div>

                    <div class="form-group">
                        <label for="name" class="form-label">Full Department Name *</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="e.g. Artificial Intelligence &amp; Data Science" required>
                    </div>

                    <div class="form-group">
                        <label for="description" class="form-label">School / Division</label>
                        <input type="text" id="description" th:field="*{description}" class="form-control" placeholder="e.g. School of Computing Sciences">
                    </div>
                </div>
                <div class="card-footer">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Save Department</button>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
