<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Users Directory | Anurag University</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="page-wrapper">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem;">
        <div>
            <h1>👥 University User Directory</h1>
            <p style="color: var(--text-secondary);">Manage campus accounts, verify role mapping, branch tags, and section assignments</p>
        </div>

        <a th:href="@{/register}" class="btn btn-primary btn-sm">+ Register New Student</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>User Name</th>
                        <th>College Email</th>
                        <th>Roll / Emp Number</th>
                        <th>Role</th>
                        <th>Department</th>
                        <th>Year &amp; Section</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td>
                            <strong th:text="${u.fullName}">User Full Name</strong>
                        </td>
                        <td style="font-family: 'JetBrains Mono', monospace;" th:text="${u.email}">email@anurag.edu.in</td>
                        <td style="font-family: 'JetBrains Mono', monospace; color: var(--accent); font-weight: 600;" th:text="${u.rollNumber}">24EG105R24</td>
                        <td>
                            <span class="badge" th:classappend="${u.role.name() == 'ROLE_ADMIN' ? 'badge-urgent' : (u.role.name() == 'ROLE_FACULTY' ? 'badge-placement' : 'badge-academic')}" th:text="${u.role.displayName}">Student</span>
                        </td>
                        <td th:text="${u.department != null ? u.department.name + ' (' + u.department.code + ')' : 'Campus-wide'}">CSE</td>
                        <td>
                            <span th:if="${u.academicYear != null}" th:text="${'Year ' + u.academicYear + (u.section != null ? ' - Sec ' + u.section : '')}">Year 2 - Sec A</span>
                            <span th:if="${u.academicYear == null}" style="color: var(--text-muted);">-</span>
                        </td>
                        <td>
                            <span style="color: var(--success); font-weight: 700;">✓ Active</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
