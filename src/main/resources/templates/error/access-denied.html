<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | Anurag University Smart Announcements</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="display: flex; flex-direction: column; justify-content: space-between;">
<div th:replace="~{fragments/header :: header}"></div>

<main class="page-wrapper" style="max-width: 560px; margin: 4rem auto; text-align: center;">
    <div class="card" style="padding: 3rem 2rem; box-shadow: var(--shadow-xl); border-top: 4px solid var(--danger);">
        <div style="font-size: 3.5rem; margin-bottom: 1rem;">🚫</div>
        <h1 style="font-size: 1.85rem; margin-bottom: 0.5rem; color: var(--danger);">403 - Access Denied</h1>
        <p style="color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.6;">
            Your account does not possess the required administrative or faculty permissions to access this specific module.
        </p>
        <div style="display: flex; justify-content: center; gap: 1rem;">
            <a th:href="@{/dashboard}" class="btn btn-primary">Return to My Dashboard</a>
            <a th:href="@{/}" class="btn btn-secondary">Portal Home</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
