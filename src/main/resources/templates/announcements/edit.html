<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Announcement | Anurag University</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="page-wrapper" style="max-width: 860px;">
    <div style="margin-bottom: 2rem;">
        <h1>✏️ Edit Announcement</h1>
        <p style="color: var(--text-secondary);">Update details, priorities or attach updated circular copies</p>
    </div>

    <div class="card" style="box-shadow: var(--shadow-lg); border-top: 4px solid var(--accent);">
        <form th:action="@{'/announcements/' + ${announcement.id} + '/edit'}" th:object="${announcementDto}" method="post" enctype="multipart/form-data">
            <div class="card-body" style="padding: 2.25rem;">
                <div class="form-group">
                    <label for="title" class="form-label">Announcement Title *</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                    <div class="form-group">
                        <label for="category" class="form-label">Category *</label>
                        <select id="category" th:field="*{category}" class="form-select" required>
                            <option th:each="c : ${categories}" th:value="${c.name()}" th:text="${c.icon + ' ' + c.label}">Category</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="priority" class="form-label">Priority Level *</label>
                        <select id="priority" th:field="*{priority}" class="form-select" required>
                            <option th:each="p : ${priorities}" th:value="${p.name()}" th:text="${p.label}">Medium</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="content" class="form-label">Details *</label>
                    <textarea id="content" th:field="*{content}" class="form-control" rows="8" required></textarea>
                </div>

                <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                    <div class="form-group">
                        <label for="files" class="form-label">Add Attachments</label>
                        <input type="file" id="files" name="files" class="form-control" multiple>
                    </div>

                    <div class="form-group">
                        <label for="expiryDate" class="form-label">Expiry Date</label>
                        <input type="date" id="expiryDate" th:field="*{expiryDate}" class="form-control">
                    </div>
                </div>

                <div class="form-check" style="background: var(--bg-surface); padding: 0.85rem 1rem; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
                    <input type="checkbox" id="isPublic" th:field="*{public}">
                    <label for="isPublic" style="font-size: 0.9rem; font-weight: 600; cursor: pointer;">
                        🌐 Mark as Public Notice
                    </label>
                </div>
            </div>

            <div class="card-footer" style="display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 2.25rem;">
                <a th:href="@{'/announcements/' + ${announcement.id}}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-accent btn-lg">Save Updates</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
