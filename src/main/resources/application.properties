# ==========================================
# Application Configuration
# Smart College Announcement & Notification Management System
# Developed for Anurag University
# ==========================================
spring.application.name=smart-college-announcements
server.port=8081

# ------------------------------------------
# MySQL Database Connection
# ------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/smart_college_announcements_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=C10@8538
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------
# JPA / Hibernate Settings
# ------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ------------------------------------------
# Thymeleaf Configuration
# ------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------
# File Upload Configuration (Circulars & Attachments)
# ------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
app.upload.dir=uploads/announcements

# ------------------------------------------
# Logging
# ------------------------------------------
logging.level.edu.anurag.announcements=INFO
logging.level.org.springframework.security=WARN
